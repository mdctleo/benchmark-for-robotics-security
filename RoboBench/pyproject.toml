[project]
name = "robobench"
version = "0.1.0"
description = "RoboBench: jailbreak attack/defense benchmark for vision-language robot planners"
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Core: what a downstream user needs for robobench.load_scenes / label / score.
dependencies = [
    "datasets>=5.1.0",
    "openai>=2.32.0",
    "pandas>=2.0",
    "pillow>=12.2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Claude target models (robobench.models.AnthropicModel).
anthropic = ["anthropic>=0.96.0"]
# Gemini target models (robobench.models.GeminiModel).
gemini = ["google-genai>=1.73.1"]
# RoboGuard defense; spot itself is a system install (src/robobench/_vendor/README.md).
roboguard = ["ipython", "networkx", "numpy", "scipy", "tiktoken"]
# Scene-graph generation for RoboGuard (robobench.defenses.roboguard.scene_graph).
scenegraph = ["google-genai>=1.73.1"]
imagegen = ["vllm==0.30.0", "vllm-omni==0.30.0"]
# Shawshank visual attack (robobench.attacks.shawshank). cv2 + numpy for the
# overlay; gensim for the word2vec example ranking (the 1.6 GB GoogleNews binary
# is a separate download).
shawshank = ["opencv-python-headless>=4.13.0.92", "numpy>=1.26", "gensim>=4.3"]

# Development-only stacks; installed by `uv sync` (default groups), never by
# `pip install robobench`.
[dependency-groups]
experiments = [
    "accelerate>=1.12.0",
    "anthropic>=0.96.0",
    "einops>=0.8.2",
    "einops-exts>=0.0.4",
    "fschat[model-worker,webui]>=0.2.36",
    "google-genai>=1.73.1",
    "isort>=8.0.1",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "matplotlib>=3.10.8",
    "numpy>=1.26",
    "open-clip-torch>=3.3.0",
    "opencv-python-headless>=4.13.0.92",
    "pip",
    "python-dotenv>=1.2.2",
    "scipy>=1.17.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers",
    "wandb>=0.26.0",
]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["experiments", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/robobench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
